<!DOCTYPE html>
<html lang="ja">
<head>

<body>
  <header>
    <div class="logo-container">
      <a class="site-logo" href="/" aria-label="みんQ ホーム"><span>みん</span><b>Q</b></a>
      <a class="header-top-button" href="/" aria-label="トップページへ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg><span>TOP</span></a>

  <main class="createContainer">
    <div class="createCard">
      <input type="password" id="password" placeholder="管理パスワード" onkeydown="if(event.key==='Enter') loadAdmin()">

      <div id="adminQuestions" style="margin-top:24px;"></div>
    </div>
  </main>

  <script src="app.js"></script>
